name: Release

# tag 推送触发：git tag v4.3 && git push origin v4.3
on:
  push:
    tags: ["v*"]

permissions:
  contents: write      # 上传 Release 资产需要

jobs:
  build-exe:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter openai pillow

      - name: Build single-file exe
        run: |
          pyinstaller --onefile --noconsole --name "米游社运营助手" `
            --icon "icon.ico" `
            --hidden-import "openai" --hidden-import "customtkinter" --hidden-import "PIL" `
            --collect-data "customtkinter" --collect-submodules "customtkinter" `
            --exclude-module torch --exclude-module torchaudio --exclude-module torchvision `
            --exclude-module scipy --exclude-module matplotlib --exclude-module pandas `
            main.py

      - name: Smoke check the built exe
        # 打包产物必须真的能启动：启动后 exe 旁会生成 data/ops_data.db
        shell: pwsh
        run: |
          $exe = "dist\米游社运营助手.exe"
          if (-not (Test-Path $exe)) { throw "打包产物缺失: $exe" }
          $p = Start-Process $exe -PassThru
          Start-Sleep -Seconds 20
          $db = Test-Path "dist\data\ops_data.db"
          if ($p) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          if (-not $db) { throw "exe 启动后未生成 data/ops_data.db（frozen 路径失效）" }
          Write-Host "exe 冒烟通过"

      - name: Rename artifact (ASCII-safe for upload)
        # 中文文件名在 runner 的编码环境下会被 gh 弄成 default.exe，先改名规避
        shell: pwsh
        run: Copy-Item "dist\米游社运营助手.exe" "dist\MiyoOpsTool.exe"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" `
            --title "${{ github.ref_name }} · 米游社运营助手" `
            --generate-notes

      - name: Upload exe to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 分两步：创建与上传分离。曾出现过 create 一步里附带文件
          # 被静默丢弃（步骤绿、asset 为空）的情况——分开后上传失败必红。
          # 若上一轮已有同名 asset（重跑场景），--clobber 覆盖。
          gh release upload "${{ github.ref_name }}" `
            "dist/MiyoOpsTool.exe#米游社运营助手 (Windows 单文件，双击即用)" `
            --clobber

      - name: Verify asset uploaded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 上传后再验一次 asset 真的挂上了（防静默失败的第二道保险）
          $names = gh release view "${{ github.ref_name }}" --json assets --jq '.assets[].name'
          if ($names -notcontains "MiyoOpsTool.exe") {
            Write-Error "Release 缺少 exe 附件，构建产物未成功上传"
            exit 1
          }
          Write-Host "asset 校验通过: $names"
