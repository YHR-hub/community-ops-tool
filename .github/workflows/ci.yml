name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"   # Windows runner 默认 cp1252, 中文输出会 UnicodeEncodeError
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter openai pillow

      - name: Run flow tests (34 items, seeds v3.8 demo data first)
        run: python flow_test.py --force

      - name: Run smoke tests (40 items, incl. layout invariants)
        run: python smoke_test.py
