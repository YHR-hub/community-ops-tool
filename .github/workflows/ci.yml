name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff (F + E4/E7/E9, config in ruff.toml)
        run: ruff check . --output-format=github

  fast-test:
    # 纯逻辑用例：不启动 GUI，秒级反馈（PR 上先红的是它）
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest customtkinter openai pillow

      - name: Seed demo data (no GUI needed)
        run: python seed_demo.py --force

      - name: Run fast logic tests
        run: pytest tests/ -m "not gui" -v

  smoke-test:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"   # Windows runner 默认 cp1252, 中文输出会 UnicodeEncodeError
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter openai pillow

      - name: Run flow tests (34 items, seeds v3.8 demo data first)
        run: python flow_test.py --force

      - name: Run smoke tests (40 items, incl. layout invariants)
        run: python smoke_test.py
